name: Media Transcoder & Uploader

on:
  repository_dispatch:
    types: [convert-media]
  workflow_dispatch:
    inputs:
      url:
        description: "Media or Video URL to download"
        required: true
        type: string
      quality:
        description: "Target Quality (1080p, 720p, 480p, mp3, original)"
        required: true
        default: "720p"
        type: string
      chat_id:
        description: "Telegram Chat ID to send file to"
        required: true
        type: string
      message_id:
        description: "Telegram Message ID to update progress on"
        required: true
        type: string

jobs:
  transcode-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (ffmpeg & ffprobe)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run Transcoder & Telegram Uploader
        env:
          TARGET_URL: ${{ github.event.client_payload.url || inputs.url }}
          QUALITY: ${{ github.event.client_payload.quality || inputs.quality }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id || inputs.message_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python worker/transcode.py
